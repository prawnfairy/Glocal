<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial scale=1.0">
        <title>GLOCAL Stock Analysis | Dashboard</title>
        <link rel="stylesheet" href="styling.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    </head>

    <body>
        <div class="dashboard">
            <h1>GLOCAL Stock Analysis - Stock Market Dashboard</h1>
        </div>

        <main>
            <div class="watchlist">
                <h2>Watchlist</h2>
                <ul id="watchlist">
                    <!-- Stock market that will be the watchlist items are displayed here -->
                </ul>
             </div>

            <div class="stockDetails">
                <h2>Stock Market Details</h2>
                <div id="stockDetails">
                    <!--Stock detail will be displayed here-->
                </div>
            </div>
        </main>

        <div class="charts-section">
            <h2>Watchlist Charts</h2>
            <div id="chartsContainer" class="charts-grid">
                <!-- Charts will be dynamically generated here -->
            </div>
        </div>

        <section class="search">
            <input type="text" id="search" placeholder="Search for stocks 🔍">
            <table id="stocks">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Stock Name</th>
                        <th>Price</th>
                        <th>Changes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!--Stock list will be displayed here-->
                </tbody>
            </table>
        </section>

        <script src="script.js"></script>
    </body>
    </html>
